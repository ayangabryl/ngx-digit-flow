<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0f0f11"/>
    </linearGradient>
    <linearGradient id="fade-t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1c"/>
      <stop offset="100%" stop-color="#1a1a1c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111113" stop-opacity="0"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="64" height="64" fill="url(#bg)"/>

    <!-- Active-row window -->
    <rect x="9" y="24" width="46" height="16" rx="3" fill="#fff" fill-opacity=".08"/>

    <!-- Subtle column dividers -->
    <line x1="25" y1="16" x2="25" y2="48" stroke="#fff" stroke-opacity=".07" stroke-width=".5"/>
    <line x1="39" y1="16" x2="39" y2="48" stroke="#fff" stroke-opacity=".07" stroke-width=".5"/>

    <!-- Ghost row above: 0 · 7 · 4 -->
    <text x="17" y="19" text-anchor="middle"
          font-family="ui-monospace,SFMono-Regular,monospace"
          font-size="9" font-weight="700" fill="#fff" opacity=".18">0</text>
    <text x="32" y="19" text-anchor="middle"
          font-family="ui-monospace,SFMono-Regular,monospace"
          font-size="9" font-weight="700" fill="#fff" opacity=".18">7</text>
    <text x="47" y="19" text-anchor="middle"
          font-family="ui-monospace,SFMono-Regular,monospace"
          font-size="9" font-weight="700" fill="#fff" opacity=".18">4</text>

    <!-- Active row: 1 · 8 · 5 -->
    <text x="17" y="36" text-anchor="middle"
          font-family="ui-monospace,SFMono-Regular,monospace"
          font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="32" y="36" text-anchor="middle"
          font-family="ui-monospace,SFMono-Regular,monospace"
          font-size="12" font-weight="700" fill="#fff">8</text>
    <text x="47" y="36" text-anchor="middle"
          font-family="ui-monospace,SFMono-Regular,monospace"
          font-size="12" font-weight="700" fill="#fff">5</text>

    <!-- Ghost row below: 2 · 9 · 6 -->
    <text x="17" y="52" text-anchor="middle"
          font-family="ui-monospace,SFMono-Regular,monospace"
          font-size="9" font-weight="700" fill="#fff" opacity=".18">2</text>
    <text x="32" y="52" text-anchor="middle"
          font-family="ui-monospace,SFMono-Regular,monospace"
          font-size="9" font-weight="700" fill="#fff" opacity=".18">9</text>
    <text x="47" y="52" text-anchor="middle"
          font-family="ui-monospace,SFMono-Regular,monospace"
          font-size="9" font-weight="700" fill="#fff" opacity=".18">6</text>

    <!-- Fade overlays — only cover ghost rows, stop before active row -->
    <rect x="0" y="0"  width="64" height="26" fill="url(#fade-t)"/>
    <rect x="0" y="38" width="64" height="26" fill="url(#fade-b)"/>
  </g>
</svg>
